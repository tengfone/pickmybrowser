[package]
name = "pickmybrowser"
version = "0.1.1"
description = "Lightweight, beautiful, cross-platform browser picker"
authors = ["tengfone"]
license = "MIT"
edition = "2024"

[lib]
name = "pickmybrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
url = "2"
base64 = "0.23"
png = "0.18"
tauri-plugin-wdio = { version = "=2.0.0-next.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=2.0.0-next.0", optional = true }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
core-foundation = "0.10"
icns = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
# E2E-only: WebdriverIO bridge + embedded WebDriver server. Never enabled for release builds.
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
